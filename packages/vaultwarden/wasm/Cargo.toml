[package]
name = "vw-password-strength"
version = "0.1.0"
edition = "2024"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.129"
zxcvbn = { version = "=3.1.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
