[package]
name = "vw-password-strength"
version = "0.1.0"
edition = "2024"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.63.0"
zxcvbn = { version = "=3.1.1", default-features = false }

[patch.crates-io]
zxcvbn = { path = "vendor/zxcvbn" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
