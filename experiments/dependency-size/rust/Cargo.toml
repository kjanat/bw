[package]
name = "vw-size-probe"
version = "0.0.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[features]
html = ["dep:html5ever", "dep:markup5ever_rcdom"]
domain = ["dep:psl"]
[dependencies]
wit-bindgen = "=0.63.0"
html5ever = { version = "=0.40.1", optional = true }
markup5ever_rcdom = { version = "=0.39.0", optional = true }
psl = { version = "=2.1.245", optional = true }
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
