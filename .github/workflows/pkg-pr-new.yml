name: pkg.pr.new
on:
  workflow_call:
    inputs:
      ref: { type: string, default: "" }
permissions: { contents: read, actions: read }
cache-mode: read
defaults: { run: { shell: "bash -euo pipefail {0}" } }
jobs:
  preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: artifacts
      - name: Verify archive checksums
        working-directory: artifacts
        run: sha256sum -c ./*.sha256
      - name: Extract built packages for preview dependency linking
        run: |
          for package in vaultwarden cli; do
            mkdir -p ".cache/pkg-pr-new/${package}"
            tar -xzf "artifacts/${package}.tgz" --strip-components=1 --directory ".cache/pkg-pr-new/${package}"
          done
      - name: Publish linked preview packages
        run: bun run --bun pkg-pr-new
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-previews
          path: artifacts/preview.json
          if-no-files-found: error
  tests:
    name: Preview packages
    needs: [preview]
    uses: $/.github/workflows/consumer.yml
    with:
      ref: ${{ inputs.ref }}
      preview: true
