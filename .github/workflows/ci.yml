name: CI

on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: { contents: read, actions: read }

jobs:
  tests:
    uses: $/.github/workflows/test.yml
    with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}" }

  previews:
    needs: [tests]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: $/.github/workflows/pkg-pr-new.yml
    with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}" }

  planner:
    name: Plan Vaultwarden compatibility matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Install tools from mise.toml
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Discover releases and deduplicate pinned and current targets
        id: matrix
        run: bun apps/cli/test/plan-compatibility.ts

  compatibility:
    name: Vaultwarden ${{ matrix.server }} / ${{ matrix.reference && format('bw {0}', matrix.referenceCliVersion) || 'protocol' }}
    needs: planner
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.matrix) }}
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
      VW_TEST_VERSION: ${{ matrix.server }}
      VW_TEST_IMAGE: ${{ matrix.image }}
      VW_TEST_BW_VERSION: ${{ matrix.referenceCliVersion || '' }}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with: { persist-credentials: false }
          - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # master
          - uses: kjanat/envctl@8a59ce4d65c5ffaa41ae326ba0d8a1fe8cde95b1 # master
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Install independent reference CLI
        if: matrix.reference
        env:
          RUNNER_DIR: ${{ runner.temp }}
          REFERENCE_CLI_VERSION: ${{ matrix.referenceCliVersion }}
        run: run bunx npm@12 install --prefix "${RUNNER_TEMP}/reference-cli" --no-audit --no-fund --ignore-scripts --min-release-age-exclude '@bitwarden/cli'
          "@bitwarden/cli@${REFERENCE_CLI_VERSION}"
      - run: runner install --no-tools --frozen
      - name: Exercise both KDFs, transfers, organizations, Sends, authentication and REST
        env:
          VW_TEST_BW: ${{ runner.temp }}/reference-cli/node_modules/.bin/bw
        run: run test:compat
      - name: Verify delivered email codes under both KDFs
        env:
          VW_TEST_SMTP: "1"
          VW_TEST_CASE: email two-factor
        run: run test:compat
      - name: Verify OIDC SSO under both KDFs
        env:
          VW_TEST_SSO: "1"
        run: run test:compat
