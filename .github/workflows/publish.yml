name: Publish
on:
  release:
    types: [published]
permissions: { contents: read, actions: read }
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
defaults: { run: { shell: "bash -euo pipefail {0}" } }
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event.release.tag_name }}
jobs:
  validate:
    name: Validate tested release assets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read, actions: read, attestations: read }
    outputs:
      release: ${{ steps.source.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Download release assets
        run: gh release download "${TAG}" --pattern '*.tgz' --pattern release.json --pattern SHA256SUMS --dir artifacts
      - name: Verify release checksums
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - name: Verify release attestations
        run: bash .github/release/verify-attestations.sh
      - name: Validate release assets and build provenance
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          jq -e --arg tag "${TAG}" --arg sha "${sha}" \
            '.tag == $tag and .version == ($tag | ltrimstr("v")) and .sha == $sha and .packages == ["vaultwarden","cli"] and (.run | type == "number" and . > 0 and . == floor)' \
            artifacts/release.json
          run=$(jq -er '.run' artifacts/release.json)
          gh run watch "${run}" --exit-status --interval 5
          gh run view "${run}" --json workflowName,conclusion | jq -e '.workflowName == "Release" and .conclusion == "success"'
          release=$(jq -c . artifacts/release.json)
          printf 'release=%s\n' "${release}" >> "${GITHUB_OUTPUT}"
  publish:
    needs: [validate]
    name: Publish ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.validate.outputs.release).packages }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: { name: npm, deployment: false }
    permissions: { contents: read, actions: read, id-token: write }
    env:
      PACKAGE: ${{ matrix.package }}
      RELEASE: ${{ needs.validate.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(env.RELEASE).sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Download approved archive and checksums
        run: gh release download "${TAG}" --pattern "${PACKAGE}.tgz" --pattern SHA256SUMS --dir artifacts
      - name: Download the tested build for comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: tested
          run-id: ${{ fromJSON(env.RELEASE).run }}
          github-token: ${{ github.token }}
      - name: Match the release archive to the tested build
        run: cmp "artifacts/${PACKAGE}.tgz" "tested/${PACKAGE}.tgz"
      - name: Publish the approved archive
        run: bash .github/release/publish.sh
