name: Publish
on:
  release:
    types: [published]
permissions: { contents: read, actions: read }
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
defaults: { run: { shell: "bash -euo pipefail {0}" } }
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event.release.tag_name }}
jobs:
  validate:
    name: Validate tested release assets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read, actions: read, attestations: read }
    outputs:
      release: ${{ steps.source.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install repository tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download release assets
        run: bun run repo release download
      - name: Verify release attestations
        run: bun run repo release verify-attestations
      - name: Validate release assets and build provenance
        id: source
        run: bun run repo release validate
  publish:
    needs: [validate]
    name: Publish ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.validate.outputs.release).packages }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: { name: npm, deployment: false }
    permissions: { contents: read, actions: read, id-token: write }
    env:
      RELEASE_PACKAGE: ${{ matrix.package }}
      RELEASE: ${{ needs.validate.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(env.RELEASE).sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install repository tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Download approved archive and checksums
        run: bun run repo release download
      - name: Download the tested build for comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: tested
          run-id: ${{ fromJSON(env.RELEASE).run }}
          github-token: ${{ github.token }}
      - name: Publish the approved archive
        run: bun run repo release publish
