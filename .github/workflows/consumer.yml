name: Installed packages
on:
  workflow_call:
    inputs:
      ref: { type: string, default: "" }
      preview: { type: boolean, default: false }
permissions: { contents: read, actions: read }
defaults: { run: { shell: "bash -euo pipefail {0}" } }
jobs:
  consumer:
    name: Installed packages (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: node, runtime: node, node: "26", runner: ubuntu-26.04 }
          - { label: node 24.8.0, runtime: node, node: "24.8.0", runner: ubuntu-26.04 }
          - { label: bun, runtime: bun, node: "26", runner: ubuntu-26.04 }
          - { label: node arm64, runtime: node, node: "26", runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env: { MISE_NODE_VERSION: "${{ matrix.node }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: npm-packages, path: &a artifacts }
      - name: Verify archive checksums
        working-directory: *a
        run: sha256sum -c ./*.sha256
      - name: Download preview publication metadata
        if: inputs.preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: package-previews, path: *a }
      - name: Install repository tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download and verify published previews
        if: inputs.preview
        run: bun run repo release preview
      - name: Test an isolated installation
        run: bun run repo release verify
        env:
          RUNTIME: ${{ matrix.runtime }}
          PREVIEW_METADATA: ${{ case(inputs.preview, 'artifacts/preview.json', '') }}
