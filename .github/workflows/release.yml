name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions: { contents: read, actions: read }
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults: { run: { shell: "bash -euo pipefail {0}" } }
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  draft:
    name: Prepare GitHub draft
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: { contents: write }
    outputs:
      release: ${{ steps.draft.outputs.release }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: '[[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create draft unless one exists
        id: draft
        run: bash .github/release/draft.sh prepare
  checks:
    needs: [draft]
    uses: $/.github/workflows/test.yml
    with:
      ref: ${{ fromJSON(needs.draft.outputs.release).sha }}
  assets:
    name: Upload tested tarballs to draft
    needs: [draft, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    env:
      RELEASE: ${{ needs.draft.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(env.RELEASE).sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: npm-packages, path: artifacts }
      - name: Prepare release assets and checksums
        run: bash .github/release/draft.sh stage
      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/vaultwarden.tgz
            artifacts/cli.tgz
            artifacts/SHA256SUMS
            artifacts/release.json
      - name: Verify release attestations
        env:
          TAG: ${{ fromJSON(env.RELEASE).tag }}
        run: bash .github/release/verify-attestations.sh
      - run: bash .github/release/draft.sh attach
