name: Test
on:
  workflow_call:
    inputs:
      ref: { type: string, default: "" }
      compatibility-mode: { type: string, default: "full" }
permissions: { contents: read, actions: read }
concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { shell: "bash -euo pipefail {0}" } }
jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: kjanat/dprint-check@29c42153a7346f4d7315883ff7722cfe22cd510c # v3
  build:
    uses: $/.github/workflows/build.yml
    with: { ref: "${{ inputs.ref }}" }
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # master
      - name: Install completion test shells
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes fish zsh; command -v pwsh python3
      - run: runner i --no-tools -fs typecheck lint test
  consumer:
    needs: [build]
    uses: $/.github/workflows/consumer.yml
    with: { ref: "${{ inputs.ref }}" }

  planner:
    name: Plan Vaultwarden compatibility matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      servers: ${{ steps.matrix.outputs.servers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - name: Install tools from mise.toml
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Discover stable server and CLI releases
        id: matrix
        env: { COMPATIBILITY_MODE: "${{ inputs.compatibility-mode }}" }
        run: bun run repo compat plan

  compatibility:
    name: Vaultwarden ${{ matrix.server }} / bw ${{ matrix.referenceCliVersion }}
    needs: planner
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.matrix) }}
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
      SERVER_VERSION: ${{ matrix.server }}
      SERVER_IMAGE: ${{ matrix.image }}
      REFERENCE_VERSION: ${{ matrix.referenceCliVersion }}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
          - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # master
          - uses: kjanat/envctl@8a59ce4d65c5ffaa41ae326ba0d8a1fe8cde95b1 # master
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install independent reference CLI
        run: run bunx npm@12 install --prefix "${RUNNER_TEMP}/reference-cli" --no-audit --no-fund --ignore-scripts --min-release-age-exclude '@bitwarden/cli'
          "@bitwarden/cli@${REFERENCE_VERSION}"
      - run: runner install --no-tools --frozen
      - name: Exercise both KDFs, transfers, organizations, Sends, authentication and REST
        env: { REFERENCE_CLI: "${{ runner.temp }}/reference-cli/node_modules/.bin/bw" }
        run: bun run repo compat run

  protocol:
    name: Vaultwarden ${{ matrix.server }} / protocol, email and SSO
    needs: planner
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.servers) }}
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
      SERVER_VERSION: ${{ matrix.server }}
      SERVER_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - parallel:
          - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
          - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # master
          - uses: kjanat/envctl@8a59ce4d65c5ffaa41ae326ba0d8a1fe8cde95b1 # master
            continue-on-error: true
      - run: runner install --no-tools --frozen
      - name: Exercise both KDFs without a reference CLI
        env: { COMPATIBILITY_PROTOCOL_ONLY: "true" }
        run: &compat bun run repo compat run
      - name: Verify delivered email codes under both KDFs
        env: { COMPATIBILITY_SMTP: "true", COMPATIBILITY_CASE: "email two-factor" }
        run: *compat
      - name: Verify OIDC SSO under both KDFs
        env: { COMPATIBILITY_SSO: "true" }
        run: *compat
