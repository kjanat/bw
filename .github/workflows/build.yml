name: Build
on:
  workflow_call:
    inputs:
      ref: { type: string, default: "" }
    outputs:
      artifact-id:
        description: Built public package archives
        value: ${{ jobs.packages.outputs.artifact-id }}
permissions: { contents: read }
jobs:
  packages:
    uses: $/.github/workflows/package.yml
    with: { ref: "${{ inputs.ref }}" }
