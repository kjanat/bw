[tools]
bun = "latest"
crane = "latest"
node = "26"
rust = { version = "1.99.1", profile = "minimal", targets = ["wasm32-wasip2", "wasm32-unknown-unknown"] }
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
tombi = "latest"
"github:kjanat/dprint" = "latest"
"github:kjanat/envctl" = "latest"
"npm:@bitwarden/cli" = "2026.10.1"

[tools."github:WebAssembly/binaryen"]
version = "133"
version_prefix = "version_"
filter_bins = ["wasm-opt"]

[tools."github:kjanat/shellcheck-rs"]
version = "latest"
asset_pattern = 'rshellcheck-*-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(linux="unknown-linux-musl", macos="apple-darwin", windows="pc-windows-msvc") }}.*'
